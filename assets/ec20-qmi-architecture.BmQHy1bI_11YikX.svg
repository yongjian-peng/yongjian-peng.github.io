<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1090" aria-labelledby="title desc" viewBox="0 0 660 1090"><title>麒麟 EC20 QMI 拨号架构</title><desc>麒麟 x86 系统通过 option 创建串口，通过 qmi_wwan 创建 QMI 控制通道和 wwan0。systemd 启动 quectel-CM 控制模组，完成 SIM 和 LTE 数据呼叫后配置 IP 与默认路由。</desc><defs><marker id="a" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path fill="#bc612f" d="m0 0 9 4.5L0 9"/></marker></defs><rect width="660" height="1090" fill="#faf4eb" rx="20"/><g fill="none" stroke="#bc612f" stroke-width="3" marker-end="url(#a)"><path d="M330 124v26H150v30"/><path d="M330 124v26h160v30"/><path d="M490 276v64"/><path d="M610 228h27v586h-27"/><path d="M150 436v84"/><path d="M280 568h70"/><path d="M280 550h38V388h32"/><path d="M490 616v150"/><path d="M490 862v54H330v44"/></g><g fill="#fffaf2" stroke="#d9bfa8" stroke-width="2"><rect width="280" height="96" x="190" y="28" rx="14"/><rect width="260" height="96" x="20" y="180" rx="14"/><rect width="260" height="96" x="350" y="180" rx="14"/><rect width="260" height="96" x="20" y="340" rx="14"/><rect width="260" height="96" x="350" y="340" rx="14"/><rect width="260" height="96" x="20" y="520" rx="14"/><rect width="260" height="96" x="350" y="520" rx="14"/><rect width="260" height="96" x="350" y="766" rx="14"/><rect width="280" height="96" x="190" y="960" rx="14"/></g><g fill="#352b25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" text-anchor="middle"><text x="330" y="67">银河麒麟 V10 SP1</text><text x="330" y="101" font-size="23">x86_64 · Linux 5.4</text><text x="150" y="219">USB option 驱动</text><text x="150" y="253" font-size="23">ttyUSB0～3 串口</text><text x="480" y="219">qmi_wwan 驱动</text><text x="480" y="253" font-size="23">创建控制与数据接口</text><text x="150" y="379">systemd 自动启动</text><text x="150" y="413" font-size="21">quectel-qmi.service</text><text x="480" y="379">QMI 控制通道</text><text x="480" y="413" font-size="23">/dev/cdc-wdm0</text><text x="150" y="559">quectel-CM</text><text x="150" y="593"