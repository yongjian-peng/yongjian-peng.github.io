<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1130" aria-labelledby="title desc" viewBox="0 0 660 1130"><title>EC20 QMI 联网分层验收</title><desc>依次检查 SIM_READY、LTE PS Attached、QMI 数据呼叫、wwan0 Raw-IP 与 IPv4、默认路由、公网 IP 通信，最后检查 DNS 解析与域名通信。前一阶段成功不能替代后一阶段验证。</desc><defs><marker id="a" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path fill="#bc612f" d="m0 0 9 4.5L0 9"/></marker></defs><rect width="660" height="1130" fill="#faf4eb" rx="20"/><g fill="none" stroke="#bc612f" stroke-width="3" marker-end="url(#a)"><path d="M330 126v56"/><path d="M330 276v56"/><path d="M330 426v56"/><path d="M330 576v56"/><path d="M330 726v56"/><path d="M330 876v56"/></g><g fill="#fffaf2" stroke="#d9bfa8" stroke-width="2"><rect width="540" height="94" x="60" y="32" rx="14"/><rect width="540" height="94" x="60" y="182" rx="14"/><rect width="540" height="94" x="60" y="332" rx="14"/><rect width="540" height="94" x="60" y="482" rx="14"/><rect width="540" height="94" x="60" y="632" rx="14"/><rect width="540" height="94" x="60" y="782" rx="14"/><rect width="540" height="94" x="60" y="932" rx="14"/></g><g fill="#352b25" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" text-anchor="middle"><text x="330" y="91">1. SIM_READY：SIM 就绪</text><text x="330" y="241">2. LTE PS Attached：分组域附着</text><text x="330" y="391">3. QMI 建立数据呼叫</text><text x="330" y="541">4. wwan0 Raw-IP 与 IPv4 配置</text><text x="330" y="691">5. 默认路由生效</text><text x="330" y="841">6. 指定接口的公网 IP 通信成功</text><text x="330" y="991">7. DNS 解析及域名通信测试</text><text x="330" y="1084" fill="#795f4c" font-size="24">每一阶段均需对应日志与实际通信证据</text></g></svg>