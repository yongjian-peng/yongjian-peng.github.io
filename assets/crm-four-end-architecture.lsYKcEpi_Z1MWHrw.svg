<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" aria-labelledby="title desc" viewBox="0 0 640 950"><title>CRM 四端职责与通信、存储关系</title><desc>Qt 通过本机 WebSocket 和 HTTP 访问 Agent，并与 Vue 一同访问后端。Agent 与后端通过 MQTT 交换遥测、事件、命令和入库收据；规则使用 Agent 主动连接的 WebSocket。SQLite 归 Agent 所有，MySQL 与 InfluxDB 归后端所有。</desc><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#b86d3e" d="m0 0 10 5-10 5Z"/></marker></defs><rect width="640" height="950" fill="#fbf5eb" rx="20"/><g fill="none" stroke="#b86d3e" stroke-width="3" marker-end="url(#a)"><path d="M154 200v140"/><path d="M486 200v140"/><path d="M254 200v36h232"/><path marker-start="url(#a)" d="M284 404h72"/><path marker-start="url(#a)" d="M154 466v132h36"/><path marker-start="url(#a)" d="M486 466v132h-36"/><path d="M24 418H8v408h16"/><path d="M616 418h16v408h-16"/></g><g fill="#fffaf2" stroke="#d4c1ab" stroke-width="2"><rect width="260" height="110" x="24" y="90" rx="15"/><rect width="260" height="110" x="356" y="90" rx="15"/><rect width="260" height="126" x="24" y="340" rx="15"/><rect width="260" height="126" x="356" y="340" rx="15"/><rect width="260" height="96" x="190" y="550" rx="15"/><rect width="260" height="146" x="24" y="756" rx="15"/><rect width="260" height="146" x="356" y="756" rx="15"/></g><g fill="#302b26" font-family="sans-serif" font-size="27" text-anchor="middle"><text x="320" y="45">四端协同，各自持有明确职责</text><text x="154" y="132">Qt / QML</text><text x="486" y="132">Vue Web</text><text x="154" y="385">C++ Agent</text><text x="486" y="385">FastAPI</text><text x="320" y="588">MQTT Broker</text><text x="154" y="798">内存 / SQLite v5</text><text x="486" y="798" font-size="25">MySQL / InfluxDB</text></g><g fill="#655546" font-family="sans-serif" font-size="23" text-anchor="middle"><text x="154" y="170">本机交互、监控与补传</text><text x="486" y="170">管理、批量控制与展示</text><text x="154" y="425">采集、压力执行与保护</text><text x="486" y="425">校验、编排与持久化</text><text x="320" y="624">消息与业务入库收据</text><text x="154" y="838">待确认、故障历史</text><text x="154" y="874">任务事件与安全归属</text><text x="486" y="838">业务状态与长期归档</text><text x="486" y="874">时序指标与遥测原文</text><text x="154" y="287" font-size="21">本机 WS / HTTP</text><text x="486" y="287" font-size="21">HTTP / 实时 WS</text><text x="356" y="225" font-size="19">Qt 也访问后端</text><text x="320" y="385" font-size="17">规则</text><text x="320" y="433" font-size="17">WS</text><text x="139" y="516" font-size="20">遥测 / 事件</text><text x="494" y="516" font-size="20">命令 / 收据</text><text x="320" y="935" font-size="18">Agent 主动连接规则 WS；连线表示数据交互关系</text></g></svg>